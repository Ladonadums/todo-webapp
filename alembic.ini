[alembic]
# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s
script_location = alembic
# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc files in the versions dir
# sourceless = false

# version location specification
version_locations = %(here)s/versions

# the output encoding used when writing revisions
output_encoding = utf-8

# sqlalchemy.url = driver://user:pass@localhost/dbname
# → Мы НЕ указываем здесь URL — он задаётся в env.py программно

[loggers]
keys = root, sqlalch

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalch]
level = WARN
handlers =
qualname = sqlalchemy.engine
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S